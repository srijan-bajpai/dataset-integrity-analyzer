services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dia}
      POSTGRES_USER: ${POSTGRES_USER:-dia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dia_secure_db_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dia} -d ${POSTGRES_DB:-dia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["api"]
    environment: &dia_environment
      DIA_ENV: production
      DIA_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-dia}:${POSTGRES_PASSWORD:-dia_secure_db_pass}@db:5432/${POSTGRES_DB:-dia}
      DIA_STORAGE_DIR: /data
      DIA_SHARED_PASSWORD: ${DIA_SHARED_PASSWORD:-changeme_dia_pass}
      DIA_CORS_ORIGINS: ${DIA_CORS_ORIGINS:-*}
      DIA_MAX_SAMPLES: ${DIA_MAX_SAMPLES:-2000}
    volumes:
      - dia_data:/data
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["worker"]
    environment: *dia_environment
    volumes:
      - dia_data:/data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  dia_data:
